version: "2.5.0"
description: >
  Luật và ngưỡng của /decide. Mức cuối là mức cao nhất trong các luật đã khớp.
  Không có luật đếm số tín hiệu. unknown không bao giờ bị coi là absent.
  Tín hiệu ngữ cảnh là trần: không bao giờ đưa mức lên trên 1. Không phải sàn.
  Chỉ cuộc gọi và người nhận mới nâng lên 1, và chỉ khi chưa có luật mức 2.

# Can thiệp sau khi luật đã khớp. Không đổi ngưỡng phát hiện.
interventions:
  lock_minutes: 30
  hotline: "1900 54 54 13"

thresholds:
  model_p_high:
    value: 0.8125
    provenance: chosen on simulated data
  recipient_age_days_below:
    value: 365
    provenance: chosen on simulated data
  distinct_senders_7d_above:
    value: 6
    provenance: chosen on simulated data
  passthrough_24h_above:
    value: 0.951
    provenance: chosen on simulated data
  behaviour_p_rarity_at_most:
    value: 0.05
    provenance: chosen on simulated data
    demo: true
  behaviour_guided_p_at_most:
    value: 0.05
    provenance: chosen on simulated data
    demo: true
  behaviour_baseline_medium_sessions:
    value: 3
    provenance: chosen on simulated data
  behaviour_baseline_high_sessions:
    value: 8
    provenance: chosen on simulated data
  funds_fresh_hours:
    value: 72
    provenance: chosen on simulated data
  episode_hours:
    value: 24
    provenance: chosen on simulated data
  customer_state_hours:
    value: 24
    provenance: chosen on simulated data
  near_limit_below:
    value: 0.005
    provenance: chosen on simulated data
  biometric_vnd:
    value: 10000000
    provenance: chosen on simulated data
  simo_prior_payments:
    value: 3
    provenance: chosen on simulated data
  simo_first_days_before_listing:
    value: 60
    provenance: chosen on simulated data
  hold_level_2_minutes:
    value: 30
    provenance: chosen on simulated data
  hold_level_3_hours:
    value: 24
    provenance: chosen on simulated data
  c_fp_fixed:
    value: 50000
    provenance: chosen on simulated data
  c_fp_rate:
    value: 0.002
    provenance: chosen on simulated data
  c_fp_sme_scale:
    value: 3
    provenance: chosen on simulated data
  cost_eta:
    value: 1
    provenance: chosen on simulated data
  habit_score_above:
    value: 0.08393150652186705
    provenance: 98th percentile of IsolationForest anomaly scores on legit train-window transactions, seed 42
  habit_profile_above:
    value: 12080.215402926278
    provenance: 98th percentile of the robust-z profile on legit train-window transactions, seed 42
  inflow_multiple:
    value: 5
    provenance: v2.5 funds inflows, set for the demo story
  inflow_min_vnd:
    value: 10000000
    provenance: v2.5 funds inflows, set for the demo story
  inflow_passthrough_ratio:
    value: 0.70
    provenance: v2.5 funds inflows, set for the demo story
  inflow_history_days:
    value: 90
    provenance: v2.5 funds inflows, window used to estimate a typical 72h inflow
  recurring_amount_within:
    value: 0.15
    provenance: v2.5 funds inflows, salary and pension stay inside this band
  recurring_month_days:
    value: 30
    provenance: v2.5 funds inflows, monthly gap for salary and pension
  recurring_gap_slack_days:
    value: 5
    provenance: v2.5 funds inflows, how far a monthly gap may drift

# Baseline cá nhân. high từ 8 phiên cùng task_type. Ngưỡng p 0,05 ở trên được đánh dấu demo.
behavioural_baseline:
  min_sessions_for_level_2: 3
  min_quality: medium
  mad_floor_fraction_of_population: 0.5
  shrink_prior: 5
  max_sessions: 30
  inclusion_delay_hours: 24
  medium_sessions: 3
  high_sessions: 8
  rarity_threshold_demo: true

# Chỉ lệch theo chiều này mới vào điểm. Mặc định hướng lên.
behaviour_directions:
  median_gap_ms: up
  p90_gap_ms: up
  burst_count: up
  pause_to_action_ratio: up
  review_dwell_ms: both
  payee_burst_count: up
  payee_mean_burst_len: down
  payee_inter_burst_gap_median_ms: up
  edit_count: up
  backtrack_count: up
  screen_revisit_count: up
  background_count: up
  background_total_ms: up

funds_types:
  term_deposit_closure: "Sổ tiết kiệm vừa được tất toán."
  savings_liquidation: "Sổ tiết kiệm vừa được tất toán."
  fast_loan_disbursement: "Khoản vay nhanh vừa được giải ngân."
  quick_loan_disbursement: "Khoản vay nhanh vừa được giải ngân."
  limit_increase: "Hạn mức vừa được nâng."
  limit_raise: "Hạn mức vừa được nâng."
  card_cash_advance: "Thẻ vừa được ứng tiền mặt."
  credit_card_cash_advance: "Thẻ vừa được ứng tiền mặt."
  p2p_inflow: "Vừa nhận tiền từ nhiều người, hoặc từ một người chưa từng chuyển tới."
  lender_inflow: "Vừa nhận giải ngân từ một bên cho vay bên ngoài ngân hàng."
  cash_deposit: "Vừa nộp tiền mặt lớn hơn nhiều so với mức thường nộp."
  own_transfer_in: "Vừa nhận tiền từ tài khoản của chính mình ở ngân hàng khác."

# Các loại tiền vào bất thường. Luật đi qua chỉ nhìn các loại này, không nhìn sổ tiết kiệm hay vay của chính ngân hàng.
inflow_kinds:
  - p2p_inflow
  - lender_inflow
  - cash_deposit
  - own_transfer_in

# Tài khoản cùng ngân hàng dùng account_type. Liên ngân hàng không có loại tài khoản:
# tên có một trong các cụm này, hoặc nằm trong verified_companies, thì không phải cá nhân.
company_markers: ["CONG TY", "CTCP", "TNHH", "QUY"]
organisation_account_types: ["business", "securities", "merchant"]
lender_markers: ["TAI CHINH", "FINANCE", "CREDIT", "CHO VAY"]
verified_companies: []

manipulation_signals:
  - has_call
  - entry_paste_or_qr
  - beneficiary_is_new
  - recent_funds_event
  - purpose_high_risk
  - screen_capture_active
  - behaviour_rare

contextual_signals:
  - has_call
  - entry_paste_or_qr
  - beneficiary_is_new
  - recent_funds_event

call_rules:
  - R_CALL_FUNDS_NEWPAYEE
  - R_CALL_NEWPAYEE
  - R_BEHAVIOUR_GUIDED

episode_context:
  - has_call
  - purpose_high_risk
  - behaviour_rare
  - screen_capture_active
  - recent_funds_event

simo_context:
  - has_call
  - entry_paste_or_qr
  - purpose_high_risk
  - behaviour_rare
  - recipient_unusual

rules:
  - id: R_CALL_FUNDS_NEWPAYEE
    level: 2
    group: A
    all_present: [has_call, recent_funds_event, beneficiary_is_new]
    needs_call: true
  - id: R_FUNDS_PASSTHROUGH
    level: 2
    group: A
    # inflow_passthrough gồm: tiền vào loại inflow trong 72 giờ, người nhận mới là tài khoản cá nhân,
    # và lệnh này cộng khoản đi từ lúc nhận đã dùng ít nhất inflow_passthrough_ratio của khoản vào.
    all_present: [inflow_passthrough, habit_money_rare]
  - id: R_PURPOSE_HIGH_RISK
    level: 2
    group: C
    all_present: [purpose_high_risk]
  - id: R_RECIPIENT_UNUSUAL
    level: 2
    group: D
    all_present: [recipient_unusual, beneficiary_is_new]
    all_absent: [merchant_verified]
  - id: R_SIMO
    level: 2
    group: D
    all_present: [recipient_simo_flag, simo_with_context]
    all_absent: [simo_info_rule]
  - id: R_SIMO_ALONE
    level: 1
    all_present: [recipient_simo_flag]
    all_absent: [simo_info_rule, simo_with_context]
  - id: R_SIMO_KNOWN
    level: 1
    all_present: [recipient_simo_flag, simo_info_rule]
  - id: R_MODEL_COST
    level: 1
    all_present: [model_p_cost]
  - id: R_MODEL_HIGH
    level: 2
    group: D
    all_present: [model_p_high]
  - id: R_BEHAVIOUR_GUIDED
    level: 2
    group: B
    all_present: [behaviour_guided, has_call, beneficiary_is_new]
    baseline_at_least: medium
    needs_call: true
  - id: R_BEHAVIOUR_ONLY
    level: 1
    all_present: [behaviour_rare]
    baseline_at_least: medium
    unless_fired: [R_BEHAVIOUR_GUIDED]
  - id: R_CAPTURE
    level: 2
    group: B
    all_present: [screen_capture_active]
  - id: R_HABIT_NEWPAYEE
    level: 1
    all_present: [habit_rare, beneficiary_is_new]
  - id: R_CALL_HABIT_NEWPAYEE
    level: 2
    group: A
    all_present: [has_call, beneficiary_is_new, habit_money_rare]
    needs_call: true
  - id: R_DEVICE_CAPABILITY
    level: 1
    all_present: [device_capability]
    extra_auth: true
  - id: R_VERIFIED_RECIPIENT
    level: 3
    any_present: [recipient_bank_confirmed_mule, recipient_le_confirmed_case]
  - id: R_VERIFIED_DEVICE
    level: 3
    all_present: [verified_compromise]
    customer_level: true
  # Trần, không phải sàn. Không chạy khi đã có luật mức 2.
  - id: R_CALL_NEWPAYEE
    level: 1
    all_present: [has_call, beneficiary_is_new]
    needs_call: true
