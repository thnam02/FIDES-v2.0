# Cảnh 3 — Vũ Thị Lan, tất toán sổ, người nhận mới, 120.000.000, không hướng dẫn. Mức 2 nhóm A, cúp máy rồi tiếp tục.
appId: com.hainamtran.saobank
---
- launchApp:
    clearKeychain: true
- tapOn: ".*Vũ Thị Lan.*"
- repeat:
    times: 7
    commands:
      - tapOn: "BVC BANK"
- tapOn:
    id: "call-stranger"
- tapOn: "Tiết kiệm"
- assertVisible: ".*150.000.000 đ.*"
- tapOn: "Tất toán trước hạn"
- assertVisible: ".*150.000.000 đ.*"
- tapOn: "Tất toán trước hạn"
- assertVisible: ".*150.000.000.*"
- tapOn: "Về trang chủ"
- tapOn: "Chuyển tiền"
- tapOn:
    id: "new-account-open"
- tapOn:
    id: "new-account"
- inputText: "ZLANB40000000002"
- tapOn:
    id: "new-account-go"
- tapOn:
    id: "amount"
- eraseText: 12
- inputText: "120000000"
- tapOn:
    id: "amount-dismiss"
- scrollUntilVisible:
    element:
      id: "purpose-open"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "purpose-open"
- tapOn: "Mua hàng, dịch vụ"
- scrollUntilVisible:
    element:
      id: "continue-transfer"
    direction: DOWN
- tapOn:
    id: "continue-transfer"
- scrollUntilVisible:
    element:
      id: "confirm-transfer"
    direction: DOWN
- tapOn:
    id: "confirm-transfer"
- assertVisible: "Tạm dừng để xác minh"
- tapOn:
    id: "reasons-toggle"
- assertVisible: ".*gần hết số dư.*"
- assertVisible: ".*cuộc gọi.*"
- assertVisible: ".*tất toán.*"
- tapOn:
    id: "demo-drawer"
- tapOn:
    id: "call-end"
- scrollUntilVisible:
    element:
      id: "choice-continue"
    direction: DOWN
- tapOn:
    id: "choice-continue"
- assertVisible: "Chuyển tiền thành công"
