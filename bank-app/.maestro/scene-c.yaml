# Cảnh 5 — Trương Gia Thịnh, cuộc gọi, người nhận gõ mới, phiên có hướng dẫn. Mức 2 nhóm B. Trương, Huỳnh và Vũ đều có baseline new_typed; cảnh này chỉ bật hướng dẫn trên Trương.
appId: com.hainamtran.saobank
---
- launchApp:
    clearKeychain: true
- tapOn: ".*Trương Gia Thịnh.*"
- repeat:
    times: 7
    commands:
      - tapOn: "BVC BANK"
- tapOn:
    id: "call-stranger"
- tapOn: "Chuyển tiền"
- tapOn:
    id: "new-account-open"
- tapOn:
    id: "new-account"
- inputText: "ZGUIDE4000000001"
- tapOn:
    id: "new-account-go"
- scrollUntilVisible:
    element:
      id: "purpose-open"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "purpose-open"
- tapOn: "Khác"
- scrollUntilVisible:
    element:
      id: "continue-transfer"
    direction: DOWN
- tapOn:
    id: "continue-transfer"
- tapOn:
    id: "demo-drawer"
- tapOn:
    id: "dev-guided"
- scrollUntilVisible:
    element:
      id: "confirm-transfer"
    direction: DOWN
- tapOn:
    id: "confirm-transfer"
- scrollUntilVisible:
    element:
      id: "choice-pause"
    direction: DOWN
- assertVisible: "Tạm dừng để xác minh"
- tapOn:
    id: "reasons-toggle"
- assertVisible: ".*theo từng cụm.*"
- assertVisible: ".*cuộc gọi.*"
- assertVisible: ".*người nhận.*"
