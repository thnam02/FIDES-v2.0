# Scene F — mục đích cơ quan nhà nước. Mức 2. Người giám hộ đã đồng ý từ trước (demo_reset) nên xác nhận được.
appId: com.hainamtran.saobank
---
- launchApp:
    clearKeychain: true
- tapOn: ".*Huỳnh Thị Mận.*"
- repeat:
    times: 7
    commands:
      - tapOn: "BVC BANK"
- tapOn:
    id: "call-stranger"
- tapOn: "Chuyển tiền"
- tapOn:
    id: "new-account-open"
- tapOn:
    id: "new-account"
- inputText: "ZMED230000000001"
- tapOn:
    id: "new-account-go"
- tapOn:
    id: "amount"
- eraseText: 12
- inputText: "23000000"
- tapOn:
    id: "amount-dismiss"
- scrollUntilVisible:
    element:
      id: "purpose-open"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "purpose-open"
- tapOn: "Cơ quan nhà nước / công an yêu cầu chuyển"
- scrollUntilVisible:
    element:
      id: "continue-transfer"
    direction: DOWN
- tapOn:
    id: "continue-transfer"
- scrollUntilVisible:
    element:
      id: "confirm-transfer"
    direction: DOWN
- tapOn:
    id: "confirm-transfer"
- assertVisible: "Tạm dừng để xác minh"
- scrollUntilVisible:
    element:
      id: "choice-guardian"
    direction: DOWN
- tapOn:
    id: "choice-guardian"
- assertVisible: "Đã gửi yêu cầu cho người giám hộ."
- launchApp
- tapOn: "GH, Người giám hộ.*"
- extendedWaitUntil:
    visible: ".*Huỳnh Thị Mận.*"
    timeout: 10000
- scrollUntilVisible:
    element: ".*23.000.000.*"
    direction: DOWN
    timeout: 20000
- tapOn: ".*23.000.000.*"
- tapOn: "Tôi xác nhận, cho chuyển"
- assertVisible: "Đã cho chuyển"
