# Cảnh 4 — Huỳnh Thị Mận, tất toán sổ, phiên có hướng dẫn, 120.000.000. Mức 2 tăng cường A+B, tổng đài xác nhận lừa đảo.
appId: com.hainamtran.saobank
---
- launchApp:
    clearKeychain: true
- tapOn: ".*Huỳnh Thị Mận.*"
- repeat:
    times: 7
    commands:
      - tapOn: "BVC BANK"
- tapOn:
    id: "call-stranger"
- tapOn: "Tiết kiệm"
- assertVisible: ".*150.000.000 đ.*"
- tapOn: "Tất toán trước hạn"
- assertVisible: ".*150.000.000 đ.*"
- tapOn: "Tất toán trước hạn"
- assertVisible: ".*150.000.000.*"
- tapOn: "Về trang chủ"
- tapOn: "Chuyển tiền"
- tapOn:
    id: "new-account-open"
- tapOn:
    id: "new-account"
- inputText: "ZLANB40000000001"
- tapOn:
    id: "new-account-go"
- tapOn:
    id: "amount"
- eraseText: 12
- inputText: "120000000"
- tapOn:
    id: "amount-dismiss"
- scrollUntilVisible:
    element:
      id: "purpose-open"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "purpose-open"
- tapOn: "Mua hàng, dịch vụ"
- scrollUntilVisible:
    element:
      id: "continue-transfer"
    direction: DOWN
- tapOn:
    id: "continue-transfer"
- tapOn:
    id: "demo-drawer"
- tapOn:
    id: "dev-guided"
- scrollUntilVisible:
    element:
      id: "confirm-transfer"
    direction: DOWN
- tapOn:
    id: "confirm-transfer"
- assertVisible: ".*nhiều dấu hiệu lừa đảo cùng lúc.*"
- scrollUntilVisible:
    element:
      id: "choice-pause"
    direction: DOWN
- assertVisible: "Tạm dừng để xác minh"
- tapOn:
    id: "reasons-toggle"
- assertVisible: ".*theo từng cụm.*"
- assertVisible: ".*cuộc gọi.*"
- scrollUntilVisible:
    element:
      id: "choice-continue"
    direction: DOWN
- assertVisible: "Có thể tiếp tục sau.*"
- scrollUntilVisible:
    element:
      id: "demo-drawer"
    direction: UP
- tapOn:
    id: "demo-drawer"
- tapOn:
    id: "demo-hotline-fraud"
- assertVisible: "Tổng đài đã xác nhận đây là lừa đảo.*"
